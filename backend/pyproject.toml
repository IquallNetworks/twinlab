[project]
name = "twinlab-backend"
version = "0.9.0"
description = "Twinlab backend: generates containerlab topologies with netlab and drives the containerlab API server."
readme = "README.md"
authors = [
    { name = "Galileo Cappella", email = "galileocapp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.0",
    "fastapi>=0.139.2",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5",
    "napalm>=5.2.0",
    "netutils>=1.18.0",
    # EXACT, unlike everything else here: Twinlab mirrors netlab internals it
    # cannot import (DEVICE_KMODS, IMAGE_PINS, the catalog's module support) and
    # promises netlab's expanded-node shape as the fact namespace's contract
    # tier, so a version change is a reviewable event rather than a resolve.
    # Both Dockerfiles `uv sync --frozen`, so the lock already governs shipped
    # images; this keeps an unlocked resolve from floating past it too.
    "networklab==26.7",
    "ntc-templates>=9.2.0",
    "psutil>=7.2.2",
    "pwdlib[argon2]>=0.3.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests are function-style; restrict class collection so domain models named
# `Test*` (TestSuite, TestExpectation, TestResult) aren't mistaken for test cases.
python_classes = ["*Tests"]
