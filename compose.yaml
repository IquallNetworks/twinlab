# Twinlab local stack.
#
# Topology:
#   frontend (Vite dev server) --/api/v1--> backend (FastAPI)
#   backend --netlab create--> clab.yml --deploy--> clab-api (containerlab)
#   backend --configure--> netlab-runner --netlab initial (ansible/docker)--> nodes
#   backend --> postgres (empty for now)
#
# The clab-api server is host-coupled by design (see its comment): it runs on the
# host network with the Docker socket and PAM databases mounted, and deploys lab
# nodes as sibling containers on the host daemon. The netlab-runner is similarly
# socket-coupled: it pushes config with `netlab initial`, which drives Ansible
# over the docker connection (exec into nodes via the mounted socket). The
# application services run on the default bridge network and reach it via the
# host gateway.

name: twinlab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # clab-api runs on the host network; reach it through the host gateway.
      CLAB_API_URL: http://host.docker.internal:8090
      CLAB_API_USERNAME: ${CLAB_API_USERNAME}
      CLAB_API_PASSWORD: ${CLAB_API_PASSWORD}
      # Config-push sidecar (netlab initial), on the compose network.
      NETLAB_RUNNER_URL: http://netlab-runner:8000
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      # Local dev is HTTP, so the session cookie can't be Secure-only. Set true
      # (the default) behind HTTPS in any real deployment.
      SESSION_COOKIE_SECURE: "false"
      # Pool the per-lab management /24s are carved from (concurrent labs get
      # distinct mgmt subnets). Override in .env if 10.77/16 clashes with a route.
      MGMT_SUBNET_POOL: ${MGMT_SUBNET_POOL:-10.77.0.0/16}
      # SSH jump host: the shared secret its key-lookup script presents to
      # /internal, and the EXTERNALLY reachable host:port advertised on
      # GET /ssh-access (keep the port in sync with JUMP_PORT).
      SSH_JUMP_TOKEN: ${JUMP_TOKEN:?set JUMP_TOKEN in .env (openssl rand -hex 32)}
      SSH_JUMP_ADDRESS: ${SSH_JUMP_ADDRESS:-localhost:2222}
      # Host-preparation sidecar (lab bridges + kernel modules), on the host
      # network like clab-api — reached through the same host gateway.
      HOSTPREP_URL: http://host.docker.internal:8091
      HOSTPREP_TOKEN: ${HOSTPREP_TOKEN:?set HOSTPREP_TOKEN in .env (openssl rand -hex 32)}
      # Host-shared lab files: deploy materializes netlab's generated
      # node_files/ here and rewrites the topology's binds to absolute paths
      # (frr's daemons file, the shared /etc/hosts, sh-mode config scripts all
      # ride binds). SAME-PATH INVARIANT: the value is one absolute path used
      # verbatim on the host, in this container, and in clab-api's mount —
      # dockerd resolves bind sources on the host, clab-api pre-flights them
      # in its own fs. Required so the stack can't silently strip binds.
      LAB_FILES_DIR: ${LAB_FILES_DIR:?set LAB_FILES_DIR in .env (absolute path, e.g. /var/lib/twinlab/lab-files)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LAB_FILES_DIR:?}:${LAB_FILES_DIR:?}
    # No host port: the backend is reached only through the frontend's /api/v1
    # proxy (over the compose network), keeping a single same-origin ingress. It
    # still listens on 8000 inside the network for the proxy and health checks.
    depends_on:
      postgres:
        condition: service_healthy
      netlab-runner:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      # Vite listens on FRONTEND_PORT inside the container; host:container are the
      # same port so the mapping holds whatever the value. DEPLOYMENT_URL's host
      # is allow-listed by the dev server (see frontend/vite.config.ts).
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      DEPLOYMENT_URL: ${DEPLOYMENT_URL:-http://localhost:5173}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    # Bind-mount source for HMR; keep the image's installed node_modules.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Config-push runner: netlab + ansible-core + community.docker + the docker
  # CLI. `netlab initial` drives Ansible over the docker connection, exec-ing
  # into the lab nodes (deployed by clab-api on the host daemon) by container
  # name — so it needs the Docker socket, but no host network. netlab (MIT) is
  # aggregated with ansible-core / community.docker (GPLv3) as separate
  # processes in this sidecar; the Apache-2.0 backend never links them.
  #
  # Plain-container nodes (linux, daemons) are NOT configured over Ansible:
  # netlab deploys their config as host-side scripts via `ip netns exec
  # clab-<lab>-<node>` (full iproute2 against the node's netns; the alpine
  # node images only carry busybox ip). containerlab's /var/run/netns entries
  # are symlinks into /proc/<pid>/ns/net, hence the host pid namespace;
  # opening another process's ns file needs SYS_PTRACE, entering it needs
  # SYS_ADMIN, the address/route/sysctl writes inside it need NET_ADMIN, and
  # the docker-default AppArmor profile denies the cross-process ns read
  # outright — none of which meaningfully widens this container's reach, since
  # the mounted Docker socket is already root-equivalent on the host.
  netlab-runner:
    build: ./netlab-runner
    pid: host
    cap_add: [SYS_ADMIN, SYS_PTRACE, NET_ADMIN]
    security_opt:
      - apparmor=unconfined
      # Docker masks /proc/sys read-only in containers; the netns scripts
      # write net.* sysctls of the TARGET node namespace through it.
      - systempaths=unconfined
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # netlab create validates the vyos /lib/modules bind path in this fs.
      - /lib/modules:/lib/modules:ro
      # The netns symlinks the ns config path resolves (see above).
      - /var/run/netns:/var/run/netns
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # SSH jump host: users tunnel (`ssh -J jump@host:2222 <user>@<node-ip>`) to
  # nodes of labs they hold lab:terminal on. Stock OpenSSH; per-key access is
  # resolved live by the backend (AuthorizedKeysCommand -> /internal), so no
  # per-user provisioning here. Plain compose network on purpose: containerlab
  # installs iptables ACCEPT rules for its mgmt bridges, so lab node addresses
  # are reachable from here without host networking or privileges (the same
  # mechanism the netlab-runner's SSH config push relies on).
  jump:
    build: ./jump
    environment:
      BACKEND_URL: http://backend:8000
      JUMP_TOKEN: ${JUMP_TOKEN:?set JUMP_TOKEN in .env (openssl rand -hex 32)}
    ports:
      - "${JUMP_PORT:-2222}:2222"
    volumes:
      # Host keys survive recreates: a changed host key looks like a MITM to
      # every user's known_hosts.
      - jump_hostkeys:/etc/ssh/host_keys
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Banner + host-key exchange proves sshd is answering (no python here;
      # ssh-keyscan ships with openssh). -t ed25519: one probe, not one per
      # host-key type — keeps the log quiet.
      test: ["CMD", "ssh-keyscan", "-T", "2", "-t", "ed25519", "-p", "2222", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Host-preparation sidecar: the ONE component allowed to touch host network
  # devices. It creates/deletes the per-lab Linux bridges that multi-access
  # (3+ endpoint) links need and modprobes the kernel modules netlab's clab
  # provider asks for (mpls, vrf, vxlan, ...) — `netlab up` pre-start work,
  # which Twinlab never runs. Host network because a bridge must be created in
  # the host's network namespace; capabilities are the exact two the job needs
  # (netlink + modprobe) on an otherwise fully-dropped set. Deliberately NO
  # Docker socket, no netlab, no definitions: it executes only pre-validated
  # primitives (fixed module allowlist, netlab-shaped bridge names) behind the
  # shared token. The backend owns all bookkeeping (bridge ownership,
  # collisions, required-vs-optional modules).
  hostprep:
    build: ./hostprep
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      HOSTPREP_TOKEN: ${HOSTPREP_TOKEN:?set HOSTPREP_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      # modprobe resolves modules against the host's kernel tree.
      - /lib/modules:/lib/modules:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8091/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Containerlab API server (github.com/srl-labs/clab-api-server, Apache-2.0).
  # It authenticates a host (PAM) user in the clab_api group and runs
  # containerlab against the host Docker daemon, so it needs host networking,
  # host PID, the Docker socket, and the passwd/shadow/group databases. Prereqs
  # on the host: a user in the `clab_api` group and the node images pulled.
  clab-api:
    image: ghcr.io/srl-labs/clab-api-server/clab-api-server:v0.5.0
    network_mode: host
    pid: host
    privileged: true
    environment:
      API_PORT: "8090"
      JWT_SECRET: ${CLAB_API_JWT_SECRET}
      API_USER_GROUP: clab_api
      SUPERUSER_GROUP: clab_admins
      # Local dev over plain HTTP; the backend talks to it in-host. Enable TLS
      # (and switch CLAB_API_URL to https) for any non-local deployment.
      TLS_ENABLE: "false"
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # rshared, because the entries under /run/netns are themselves nsfs
      # MOUNTS (one per namespace): with the default rprivate, binds made
      # after container start don't cross the boundary in either direction.
      # containerlab's node stop "parks" the node's interfaces into a netns it
      # creates here, and with a private mount it either sees a bare tmpfs
      # file where the host has a namespace (unknown FS magic 0x1021994) or
      # strands its park namespace as a plain file for the next instance to
      # trip over — node/lab stop then 500s.
      - type: bind
        source: /var/run/netns
        target: /var/run/netns
        bind:
          propagation: rshared
      - /var/lib/docker/containers:/var/lib/docker/containers
      # containerlab pre-flight-stats bind sources in THIS container's fs; the
      # actual mount happens on the host daemon. vyos nodes bind /lib/modules,
      # so it must exist here (same path) as well as on the host.
      - /lib/modules:/lib/modules:ro
      # The backend's materialized lab files (node_files/ per lab), same-path
      # so the pre-flight sees exactly what dockerd will mount. Read-only:
      # only the backend writes here.
      - ${LAB_FILES_DIR:?set LAB_FILES_DIR in .env}:${LAB_FILES_DIR:?}:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /etc/group:/etc/group:ro
      - /etc/gshadow:/etc/gshadow:ro
      - /home:/home
    restart: unless-stopped

volumes:
  pgdata:
  jump_hostkeys:
