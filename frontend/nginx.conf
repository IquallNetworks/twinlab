# Production routing: the static bundle plus the /api/v1 seam. This is the
# prod sibling of the Vite dev server's proxy block in vite.config.ts — same
# seam, same WebSocket pass-through, so the backend sees identical traffic
# from either mode.
#
# TEMPLATE: ${BASE_PATH}, ${SPA_LOCATION} and ${ROOT_REDIRECT} are rendered by
# the Dockerfile's build stage from the BASE_PATH build arg. At the root
# (BASE_PATH empty) the result is the plain config; under a subpath every
# location moves with it and the bundle sits at html${BASE_PATH}, so the
# container serves the app natively at /twinlab/… and a fronting proxy needs
# no prefix stripping.

# The terminal WebSocket needs a hop-by-hop Connection header; ordinary
# requests must not get one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Fixed container-side port; compose publishes FRONTEND_PORT onto it.
    listen 5173;

    # Config import posts whole device configurations; nginx's 1m default is
    # tight for a multi-device import.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Empty at the root; a subpath build redirects a bare / to the app.
    ${ROOT_REDIRECT}

    location ${BASE_PATH}/api/v1 {
        # Resolve `backend` per request through Docker's embedded DNS: a
        # variable target keeps nginx from pinning the IP at startup, so a
        # recreated backend container doesn't leave the UI on a stale 502.
        # (With a variable, nginx passes the rewritten URI as-is — which is
        # exactly what this location wants.) The `set` must precede the
        # rewrite: its `break` ends rewrite-phase processing, and `set`
        # belongs to that phase.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;

        # The base prefix is presentation; the backend speaks /api/v1. A no-op
        # at the root.
        rewrite ^${BASE_PATH}(/api/v1.*)$ $1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle terminal session sends nothing; the 60s default would cut
        # it off. The SSE stream needs no exception of its own — it emits a
        # keepalive comment every 15s, and the backend's X-Accel-Buffering:
        # no header already switches buffering off for it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite emits content-hashed assets: safe to cache forever.
    location ${BASE_PATH}/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else under the base is an SPA route the client-side router
    # resolves; serve the shell and let it. no-cache so a redeploy is picked
    # up on reload.
    location ${SPA_LOCATION} {
        add_header Cache-Control "no-cache";
        try_files $uri ${BASE_PATH}/index.html;
    }
}
