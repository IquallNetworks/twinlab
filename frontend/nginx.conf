# Production routing: the static bundle plus the /api/v1 seam. This is the
# prod sibling of the Vite dev server's proxy block in vite.config.ts — same
# seam, same WebSocket pass-through, so the backend sees identical traffic
# from either mode.

# The terminal WebSocket needs a hop-by-hop Connection header; ordinary
# requests must not get one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Fixed container-side port; compose publishes FRONTEND_PORT onto it.
    listen 5173;

    # Config import posts whole device configurations; nginx's 1m default is
    # tight for a multi-device import.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/v1 {
        # Resolve `backend` per request through Docker's embedded DNS: a
        # variable target keeps nginx from pinning the IP at startup, so a
        # recreated backend container doesn't leave the UI on a stale 502.
        # (With a variable, nginx passes the request URI as-is — which is
        # exactly what this location wants.)
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle terminal session sends nothing; the 60s default would cut
        # it off. The SSE stream needs no exception of its own — it emits a
        # keepalive comment every 15s, and the backend's X-Accel-Buffering:
        # no header already switches buffering off for it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite emits content-hashed assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is an SPA route the client-side router resolves; serve
    # the shell and let it. no-cache so a redeploy is picked up on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
