[project]
name = "netlab-runner"
version = "0.9.0"
description = "Twinlab config-push runner: netlab initial over the docker connection"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # netlab (generator + config push) and ansible (its push engine). netlab
    # shells out to the `ansible-playbook` on PATH; keeping both in one venv also
    # silences netlab's "cannot import ansible" version-probe wart.
    # Pinned EXACT, and to the same version as the backend: the two run `netlab
    # create` on the same definition and must expand it identically, or the
    # runner regenerates an inventory that disagrees with the deployed topology.
    "networklab==26.7",
    "ansible-core",
    # SSH transport for Ansible's network_cli connection (MikroTik CHR config
    # push). VyOS and the daemons use the docker connection and need none of
    # this, but a network_cli device is only reachable over SSH;
    # ansible.netcommon's persistent connection drives paramiko.
    "paramiko",
    "pyyaml",
    "netmiko>=4.7.0",
]

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pytest",
    "pytest-asyncio",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netlab_runner"
module-root = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
